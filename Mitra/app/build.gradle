plugins {
    id 'com.android.application'
    // id 'com.jakewharton.butterknife' // Anda menonaktifkan ini
    id 'com.google.gms.google-services'
    id 'realm-android'
}

android {
    namespace "com.rcdriver.mt"
    compileSdk 36

    defaultConfig {
        applicationId "com.rcdriver.mt"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        useLibrary 'org.apache.http.legacy'
    }

    signingConfigs {
        debug {
            storeFile rootProject.file("mt.jks")
            storePassword "1234567"
            keyAlias "mt"
            keyPassword "1234567"
        }
        config {
            storeFile rootProject.file("mt.jks")
            storePassword "1234567"
            keyAlias "mt"
            keyPassword "1234567"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.config
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            signingConfig signingConfigs.config
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        jniLibs {
            excludes += [
                    "lib/arm64-v8a/libcardioDecider.so",
                    "lib/arm64-v8a/libcardioRecognizer.so",
                    "lib/arm64-v8a/libcardioRecognizer_tegra2.so",
                    "lib/arm64-v8a/libopencv_core.so",
                    "lib/arm64-v8a/libopencv_imgproc.so",
                    "lib/armeabi/libcardioDecider.so",
                    "lib/armeabi-v7a/libcardioDecider.so",
                    "lib/armeabi-v7a/libcardioRecognizer.so",
                    "lib/armeabi-v7a/libcardioRecognizer_tegra2.so",
                    "lib/armeabi-v7a/libopencv_core.so",
                    "lib/armeabi-v7a/libopencv_imgproc.so",
                    "lib/mips/libcardioDecider.so",
                    "lib/x86/libcardioDecider.so",
                    "lib/x86/libcardioRecognizer.so",
                    "lib/x86/libcardioRecognizer_tegra2.so",
                    "lib/x86/libopencv_core.so",
                    "lib/x86/libopencv_imgproc.so",
                    "lib/x86_64/libcardioDecider.so",
                    "lib/x86_64/libcardioRecognizer.so",
                    "lib/x86_64/libcardioRecognizer_tegra2.so",
                    "lib/x86_64/libopencv_core.so",
                    "lib/x86_64/libopencv_imgproc.so"
            ]
        }
        resources {
            excludes += [
                    "AndroidManifest.xml"
            ]

            // Ditambahkan untuk mengatasi peringatan 16KB dari build tool
            excludes += ['**/dump_syms.bin']
            excludes += ['dump_syms/linux/dump_syms.bin']
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation fileTree(include: ["*.jar"], dir: "libs")

    androidTestImplementation("androidx.test.espresso:espresso-core:3.1.0") {
        exclude group: "com.android.support", module: "support-annotations"
    }

    implementation("com.mikepenz:fastadapter:2.0.0@aar") { transitive = true }

    implementation "com.google.android.gms:play-services-location:21.3.0"
    implementation "com.google.android.libraries.places:places:3.5.0"
    implementation "com.google.android.gms:play-services-maps:18.2.0"
    implementation "com.google.android.gms:play-services-auth:21.2.0"

    implementation "com.google.firebase:firebase-database:21.0.0"
    implementation "com.google.firebase:firebase-storage:21.0.0"
    implementation "com.google.firebase:firebase-messaging:24.0.0"
    implementation "com.google.firebase:firebase-auth:23.0.0"

    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.multidex:multidex:2.0.1"
    implementation "com.google.guava:guava:32.1.3-android"

//    implementation "com.jakewharton:butterknife:10.2.3"
//    annotationProcessor "com.jakewharton:butterknife-compiler:10.2.3"

    implementation "me.relex:circleindicator:1.2.1@aar"

    // DIKEMBALIKAN ke 4.12.0 (versi 5.x.x hanya untuk Kotlin)
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"

//    implementation "com.jakewharton.picasso:picasso2-okhttp3-downloader:1.1.0" // Anda menonaktifkan ini
    implementation "com.squareup.retrofit2:retrofit:2.11.0"
    implementation "com.squareup.retrofit2:converter-gson:2.11.0"

    implementation "com.mobsandgeeks:android-saripaar:2.0.3"
    implementation "io.github.everythingme:overscroll-decor-android:1.1.1"
    implementation "com.github.amitshekhariitbhu:PRDownloader:1.0.2"
    implementation "net.the4thdimension:audio-wife:1.0.3"
    implementation "org.greenrobot:eventbus:3.3.1"
    implementation "com.makeramen:roundedimageview:2.3.0"
    implementation "com.squareup.picasso:picasso:2.71828"
    implementation "com.github.siyamed:android-shape-imageview:0.9.3"
    implementation "androidx.cardview:cardview:1.0.0"
    implementation "androidx.legacy:legacy-support-v4:1.0.0"
    implementation "de.hdodenhof:circleimageview:3.1.0"
    implementation "com.github.yesterselga:country-picker-android:1.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "com.wdullaer:materialdatetimepicker:4.2.3"
    implementation "org.jsoup:jsoup:1.17.2"
    implementation "androidx.exifinterface:exifinterface:1.3.7"

    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    testImplementation "junit:junit:4.13.2"

    implementation files("libs/WoosimLib231.jar")
    implementation "me.dm7.barcodescanner:zxing:1.9"
    implementation "com.github.bumptech.glide:glide:4.16.0"
}

