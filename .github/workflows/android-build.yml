name: Android Build (Customer)

# Verifies the SDK 36 migration by actually compiling/packaging the customer app.
# rc.jks is gitignored, so a throwaway debug keystore is generated in CI to satisfy
# the signingConfig (alias/passwords must match app/build.gradle).

on:
  push:
    branches: [ "claude/ojek-app-rewrite-ho2kbo" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 36 platform + build-tools
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null || true

      - name: Generate throwaway debug keystore (rc.jks is gitignored)
        run: |
          keytool -genkeypair -noprompt \
            -keystore rc.jks -storepass 1234567 -keypass 1234567 \
            -alias key0 -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=CI Build, OU=CI, O=RC, L=NA, S=NA, C=NA"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: customer-debug-apk
          path: customer/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
