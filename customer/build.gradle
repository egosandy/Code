// Top-level build file — migrated to AGP 8.x for compileSdk/targetSdk 36.
buildscript {
    ext {
        agp_version = '8.11.1'
    }
    repositories {
        google()
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$agp_version"
        classpath 'com.google.gms:google-services:4.4.2'
        // Removed for the SDK 36 migration:
        //  - butterknife-gradle-plugin (incompatible with AGP 8; replaced by ViewBinding)
        //  - realm-gradle-plugin       (EOL, incompatible with AGP 8; replaced by Room)
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        // jcenter() removed: the repository is sunset/read-only and no longer served.
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
