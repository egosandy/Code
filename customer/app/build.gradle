apply plugin: 'com.android.application'
apply plugin: 'realm-android'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.jakewharton.butterknife'
android {
    signingConfigs {
        debug {
            storeFile rootProject.file('rc.jks')
            storePassword '1234567'
            keyPassword '1234567'
            keyAlias 'key0'
        }
        release {
            storeFile rootProject.file('rc.jks')
            storePassword '1234567'
            keyPassword '1234567'
            keyAlias 'key0'
        }
    }
    useLibrary 'org.apache.http.legacy'
    compileSdkVersion 34
    defaultConfig {
        applicationId 'com.rcdriver.cs'
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled true
        compileOptions {
            sourceCompatibility JavaVersion.VERSION_1_8
            targetCompatibility JavaVersion.VERSION_1_8
        }
        sourceSets {
            main.java.srcDirs += 'src/main/com.rcdriver.cs'
        }
        dataBinding {
            enabled = true
        }
        packagingOptions {
            exclude 'META-INF/*'
            pickFirst 'lib/x86/librealm-jni.so'
            pickFirst 'lib/x86_64/librealm-jni.so'
            pickFirst 'lib/armeabi/librealm-jni.so'
            pickFirst 'lib/armeabi-v7a/librealm-jni.so'
            pickFirst 'lib/arm64-v8a/librealm-jni.so'
            pickFirst 'lib/arm64-v8a/libcardioDecider.so'
            pickFirst 'lib/arm64-v8a/libcardioRecognizer.so'
            pickFirst 'lib/arm64-v8a/libcardioRecognizer_tegra2.so'
            pickFirst 'lib/arm64-v8a/libopencv_core.so'
            pickFirst 'lib/arm64-v8a/libopencv_imgproc.so'
            pickFirst 'lib/armeabi/libcardioDecider.so'
            pickFirst 'lib/armeabi-v7a/libcardioDecider.so'
            pickFirst 'lib/armeabi-v7a/libcardioRecognizer.so'
            pickFirst 'lib/armeabi-v7a/libcardioRecognizer_tegra2.so'
            pickFirst 'lib/armeabi-v7a/libopencv_core.so'
            pickFirst 'lib/armeabi-v7a/libopencv_imgproc.so'
            pickFirst 'lib/mips/libcardioDecider.so'
            pickFirst 'lib/x86/libcardioDecider.so'
            pickFirst 'lib/x86/libcardioRecognizer.so'
            pickFirst 'lib/x86/libcardioRecognizer_tegra2.so'
            pickFirst 'lib/x86/libopencv_core.so'
            pickFirst 'lib/x86/libopencv_imgproc.so'
            pickFirst 'lib/x86_64/libcardioDecider.so'
            pickFirst 'lib/x86_64/libcardioRecognizer.so'
            pickFirst 'lib/x86_64/libcardioRecognizer_tegra2.so'
            pickFirst 'lib/x86_64/libopencv_core.so'
            pickFirst 'lib/x86_64/libopencv_imgproc.so'
        }

        signingConfig signingConfigs.release
        proguardFiles 'butterknife-proguard-rules.pro', 'guava-proguard-rules.pro', 'okhttp3-proguard-rules.pro', 'proguard-rules.pro', 'retrofit-proguard-rules.pro', 'saripaar-proguard-rules.pro'
    }
    flavorDimensions "mode"
    buildTypes {
        debug {
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        release {
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    dexOptions {
        //    incremental true
        javaMaxHeapSize "4g"
        preDexLibraries true
        dexInProcess = true
    }
    packagingOptions {
        jniLibs {
            excludes += ['META-INF/*', 'lib/arm64-v8a/libcardioDecider.so', 'lib/arm64-v8a/libcardioRecognizer.so', 'lib/arm64-v8a/libcardioRecognizer_tegra2.so', 'lib/arm64-v8a/libopencv_core.so', 'lib/arm64-v8a/libopencv_imgproc.so', 'lib/armeabi/libcardioDecider.so', 'lib/armeabi-v7a/libcardioDecider.so', 'lib/armeabi-v7a/libcardioRecognizer.so', 'lib/armeabi-v7a/libcardioRecognizer_tegra2.so', 'lib/armeabi-v7a/libopencv_core.so', 'lib/armeabi-v7a/libopencv_imgproc.so', 'lib/mips/libcardioDecider.so', 'lib/x86/libcardioDecider.so', 'lib/x86/libcardioRecognizer.so', 'lib/x86/libcardioRecognizer_tegra2.so', 'lib/x86/libopencv_core.so', 'lib/x86/libopencv_imgproc.so', 'lib/x86_64/libcardioDecider.so', 'lib/x86_64/libcardioRecognizer.so', 'lib/x86_64/libcardioRecognizer_tegra2.so', 'lib/x86_64/libopencv_core.so', 'lib/x86_64/libopencv_imgproc.so']
        }
        resources {
            excludes += ['AndroidManifest.xml', 'META-INF/*']
        }
    }
    compileOptions {
        targetCompatibility JavaVersion.VERSION_1_8
        sourceCompatibility JavaVersion.VERSION_1_8
    }
    namespace 'com.rcdriver.cs'
    lint {
        abortOnError true
        checkReleaseBuilds false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.google.firebase:firebase-ads:21.1.0'
    androidTestImplementation('androidx.test.espresso:espresso-core:3.1.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    implementation('com.mikepenz:fastadapter:2.0.0@aar') {
        transitive = true
    }
    implementation group: 'javax.xml.bind', name: 'jaxb-api', version: '2.2.12-b140109.1041'
    implementation group: 'xerces', name: 'xercesImpl', version: '2.12.0'
    //noinspection GradleCompatible
    implementation 'com.google.android.gms:play-services-location:20.0.0'
    implementation 'com.google.android.libraries.places:places:2.6.0'
    implementation 'com.google.android.gms:play-services-places:17.0.0'
    implementation 'com.google.maps.android:android-maps-utils:0.6.2'
    implementation 'com.google.android.gms:play-services-maps:18.1.0'
    implementation 'com.google.maps:google-maps-services:0.15.0'
    implementation 'org.slf4j:slf4j-nop:1.7.25'
    implementation 'com.google.android.gms:play-services-auth:20.2.0'
    implementation 'com.google.android.material:material:1.4.0'

    implementation platform('com.google.firebase:firebase-bom:25.12.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-database:20.0.5'
    implementation 'com.google.firebase:firebase-storage:20.0.1'
    implementation 'com.google.firebase:firebase-messaging:23.0.7'
    implementation 'com.google.firebase:firebase-core:21.1.0'
    implementation 'com.google.firebase:firebase-auth:21.0.7'
    implementation 'com.google.firebase:firebase-messaging-directboot:23.0.7'

    implementation 'com.jakewharton.picasso:picasso2-okhttp3-downloader:1.1.0'
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'com.google.android.material:material:1.2.1'
    implementation 'androidx.multidex:multidex:2.0.1'

    implementation 'com.facebook.shimmer:shimmer:0.1.0@aar'
    implementation 'com.google.guava:guava:24.1-jre'
    implementation 'com.jakewharton:butterknife:10.2.3'
    annotationProcessor 'com.jakewharton:butterknife-compiler:10.2.3'
    implementation 'com.squareup.okhttp3:okhttp:4.9.0'
    implementation 'com.squareup.retrofit2:retrofit:2.7.2'
    implementation 'com.squareup.retrofit2:converter-gson:2.7.2'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.0'
    implementation 'com.mobsandgeeks:android-saripaar:2.0.3'
    implementation 'io.github.everythingme:overscroll-decor-android:1.1.1'
    implementation 'com.github.amitshekhariitbhu:PRDownloader:1.0.2'
    implementation 'net.the4thdimension:audio-wife:1.0.3'
    implementation 'org.greenrobot:eventbus:3.2.0'
    implementation 'com.makeramen:roundedimageview:2.3.0'
    implementation 'com.squareup.picasso:picasso:2.5.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'de.hdodenhof:circleimageview:3.0.0'
    implementation 'com.github.yesterselga:country-picker-android:1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'com.wdullaer:materialdatetimepicker:3.2.0'
    implementation 'org.jsoup:jsoup:1.11.3'
    implementation "androidx.exifinterface:exifinterface:1.3.2"
    testImplementation 'junit:junit:4.12'


    implementation 'com.github.bumptech.glide:glide:4.11.0'
    implementation 'com.github.bumptech.glide:okhttp3-integration:4.11.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.11.0'

    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.19'
    // For using the Midtrans Sandbox
//    implementation 'com.midtrans:uikit:1.28.0'
//    implementation 'com.midtrans:corekit:1.28.0'
    // For using the Midtrans Production
    // implementation 'com.midtrans:uikit:1.28.0'
    //implementation 'com.midtrans:corekit:1.28.0'

    implementation 'com.google.android.gms:play-services-vision:20.1.3'

    implementation 'org.parceler:parceler-api:1.1.12'
    annotationProcessor 'org.parceler:parceler:1.1.12'

    implementation 'com.loopj.android:android-async-http:1.4.9'
    implementation 'com.github.GrenderG:Toasty:1.5.0'

    implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'
    implementation 'nl.joery.animatedbottombar:library:1.0.4'
    implementation 'com.github.10uroi:ToastOX:1.0.1'
    implementation 'com.github.ismaeldivita:chip-navigation-bar:1.4.0'

    implementation 'com.facebook.android:facebook-android-sdk:4.40.0'
    implementation 'com.github.ghedeon:dottedLineView:1.0.0'
    implementation 'com.github.jakob-grabner:Circle-Progress-View:1.4'

    implementation 'com.sun.mail:android-mail:1.6.4'
    implementation 'com.sun.mail:android-activation:1.6.4'
//    implementation group: 'com.github.jrvansuita', name: 'CheckNewAppVersionAvailable', version: 'v1.0.0'
    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.3'
    implementation 'androidx.work:work-runtime:2.7.1'
    implementation 'androidx.work:work-runtime-ktx:2.7.1'

    implementation 'com.google.firebase:firebase-iid:21.1.0'

    implementation 'me.relex:circleindicator:1.2.1@aar'


}


repositories {
    mavenCentral()
}
