# Project-wide Gradle settings.
# Migrated for AGP 8.11 / Gradle 8.13 / compileSdk 36.

# AndroidX (required by AGP 8). Jetifier kept on for the older AAR dependencies
# (loopj, facebook 4.x, etc.) that still reference the legacy support library.
android.useAndroidX=true
android.enableJetifier=true

# JVM args for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

kotlin.code.style=official

# Keep the legacy R class behavior the existing Java code relies on:
#  - nonTransitiveRClass=false -> R contains resources of dependencies too
#  - nonFinalResIds=false      -> resource IDs stay final (switch on R.id keeps working)
android.nonTransitiveRClass=false
android.nonFinalResIds=false

# BuildConfig is opt-in starting with AGP 8; the app reads BuildConfig fields.
android.defaults.buildfeatures.buildconfig=true

# Allow compileSdk 36 without a tooling warning if AGP is slightly behind.
android.suppressUnsupportedCompileSdk=36

# Note: android.enableUnitTestBinaryResources was removed and is no longer set.
